name: Workset Windows Release

on:
  push:
    branches: [main]
    paths:
      - workset/package.json
      - .github/workflows/workset-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workset-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: workset
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application logic
        run: npm test
      - name: Build Windows portable ZIP
        run: npm run package:win
      - name: Verify packaged application
        run: |
          $release = Get-Content dist/releases/release.json -Raw | ConvertFrom-Json
          $env:WORKSET_EXE = Join-Path (Get-Location) $release.executable
          npm run test:compact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.cjs
